<div style="padding:2rem;max-width:450px">
  <h2>Add New Employee</h2>
  <div style="display:flex;flex-direction:column;gap:1rem">
    <input [(ngModel)]="emp.name" placeholder="Full Name" style="padding:10px;font-size:1rem"/>
    <input [(ngModel)]="emp.email" placeholder="Email" style="padding:10px;font-size:1rem"/>
    <input [(ngModel)]="emp.department" placeholder="Department" style="padding:10px;font-size:1rem"/>
    <input [(ngModel)]="emp.position" placeholder="Position" style="padding:10px;font-size:1rem"/>
    <button (click)="submit()" style="padding:12px;background:#1a237e;color:white;border:none;font-size:1rem;cursor:pointer">Add Employee</button>
    <p style="color:green;font-weight:bold">{{message}}</p>
  </div>
</div>
